name: "RDP Fabric Pro"

# V9.3 — audit pass 1+6: NO dispatch input is interpolated into shell/pwsh code.
# Everything flows through env vars; the engine validates them.
# runner_image is validated in the orchestrate job before runs-on ever asks.
# v9.3.1: runs-on uses the validated output directly (fromJSON is for matrices,
# not plain strings).

on:
  workflow_dispatch:
    inputs:
      runner_image:
        description: "Runner label. Public: windows-latest / windows-2025. Self-hosted needs repo variable FAB_ALLOW_SELF_HOSTED=true"
        required: false
        default: "windows-latest"
      instance_count:
        description: "Parallel nodes (keep low on public runners)"
        required: false
        default: "1"
        type: choice
        options: ["1", "2", "3"]
      runtime_minutes:
        description: "Session duration in minutes (max 345)"
        required: true
        default: "345"
      workload_profile:
        description: "Adaptive tuning profile (network = interactive + Phase 2.1)"
        required: false
        default: "auto"
        type: choice
        options: [auto, interactive, memory, network]
      quick_test:
        description: "Run 5-minute smoke test"
        type: boolean
        default: false
      rdp_compression:
        description: "RDP wire compression: auto = off on direct, on when relayed"
        required: false
        default: "auto"
        type: choice
        options: [auto, on, off]
      reclaim_disk:
        description: "Reclaim temp caches so payloads fit"
        type: boolean
        default: true
      enable_ramdisk:
        description: "Ignored unless node has >= 28 GB RAM"
        type: boolean
        default: false
      startup_url:
        description: "Optional HTTPS URL to open at logon (empty = none; non-HTTPS is rejected)"
        required: false
        default: ""
      notify:
        description: "Send Telegram online/failure pings"
        type: boolean
        default: false
      lockdown:
        description: "Audit mode: keep Defender, SmartScreen, UAC secure prompts and default exec policy"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rdp-fabric-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      timeout: ${{ steps.set.outputs.timeout }}
      runner: ${{ steps.set.outputs.runner }}
    env:
      IN_COUNT: ${{ inputs.instance_count }}
      IN_RUNTIME: ${{ inputs.runtime_minutes }}
      IN_QUICK: ${{ inputs.quick_test }}
      IN_RUNNER: ${{ inputs.runner_image }}
      ALLOW_SELFHOSTED: ${{ vars.FAB_ALLOW_SELF_HOSTED }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail

          count="$IN_COUNT"
          runtime="$IN_RUNTIME"
          [ "$IN_QUICK" = "true" ] && runtime=5
          timeout=$((runtime + 15))
          [ "$timeout" -gt 360 ] && timeout=360

          # Audit fix 1: runner label allowlist — a self-hosted label points at
          # an operator-controlled machine that would receive ALL the secrets.
          runner="$IN_RUNNER"
          case "$runner" in
            windows-latest|windows-2025) ;;
            *)
              if [ "${ALLOW_SELFHOSTED:-}" = "true" ] && [[ "$runner" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "Self-hosted runner '$runner' approved via FAB_ALLOW_SELF_HOSTED."
              else
                echo "::error::runner_image '$runner' rejected. Use windows-latest or set repo variable FAB_ALLOW_SELF_HOSTED=true for a label of [A-Za-z0-9._-]+ only."
                exit 1
              fi ;;
          esac

          ids=$(seq 1 "$count" | jq -R . | jq -s -c .)
          echo "matrix={\"id\":$ids}" >> "$GITHUB_OUTPUT"
          echo "timeout=$timeout" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "Orchestrating $count node(s) on $runner, job timeout ${timeout}m."

  fabric:
    needs: orchestrate
    runs-on: ${{ needs.orchestrate.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.orchestrate.outputs.timeout) }}
    strategy:
      matrix: ${{ fromJson(needs.orchestrate.outputs.matrix) }}
      max-parallel: 3
      fail-fast: false
    env:
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_PASS: ${{ secrets.RDP_PASSWORD }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      RDP_USER: FabricAdmin
      FABRIC_ROOT: C:\ProgramData\RDPFabric
      MATRIX_ID: ${{ matrix.id }}
      RUN_ID: ${{ github.run_id }}
      # Input passthrough — env only; the engine validates every value.
      FAB_RUNNER_IMAGE: ${{ needs.orchestrate.outputs.runner }}
      FAB_INSTANCE_COUNT: ${{ inputs.instance_count }}
      FAB_RUNTIME: ${{ inputs.runtime_minutes }}
      FAB_PROFILE_INPUT: ${{ inputs.workload_profile }}
      FAB_QUICKTEST: ${{ inputs.quick_test }}
      FAB_RAMDISK: ${{ inputs.enable_ramdisk }}
      FAB_RDPCOMP: ${{ inputs.rdp_compression }}
      FAB_RECLAIM: ${{ inputs.reclaim_disk }}
      FAB_STARTUP_URL: ${{ inputs.startup_url }}
      FAB_NOTIFY: ${{ inputs.notify }}
      FAB_LOCKDOWN: ${{ inputs.lockdown }}
      FAB_TS_VERSION: ${{ vars.FAB_TS_VERSION }}
      FAB_TS_SHA256: ${{ vars.FAB_TS_SHA256 }}

    steps:
      - uses: actions/checkout@v5

      - name: Fabric engine
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/Fabric.ps1 -Mode full

      - name: Teardown
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/teardown.ps1

      - name: Failure alert
        if: failure()
        shell: pwsh
        run: |
          if ($env:FAB_NOTIFY -notmatch '^(?i)true$') { exit 0 }
          if (-not $env:TG_TOKEN -or -not $env:TG_CHAT) { exit 0 }
          $st = $null
          try { $st = Get-Content "C:\ProgramData\RDPFabric\state.json" -Raw | ConvertFrom-Json } catch {}
          $msg = "❌ <b>Fabric Node FAILED</b>`n🖥 <code>$($st.host)</code>`n🌐 <code>$($st.ip)</code>`n🧠 <code>$($st.profile)</code>`n👤 <code>$($st.user)</code>`n⏳ <code>$($st.minutes_left)</code> min left"
          try { Invoke-RestMethod "https://api.telegram.org/bot$($env:TG_TOKEN)/sendMessage" -Method Post -Body @{chat_id=$env:TG_CHAT; text=$msg; parse_mode='HTML'} -TimeoutSec 15 | Out-Null } catch {}
